<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schoolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --pine:#23473A; --pine-2:#2F5E4D; --moss:#DCE9C6; --paper:#F6F7F2; --card:#FFFFFF;
  --ink:#1D2A24; --muted:#66756D; --line:#E3E7DF; --on-pine:#FFFFFF;
  --red:#B3412F; --red-bg:#FBE6E1; --amber:#8A5A12; --amber-bg:#F8ECD3; --blue:#2C5A7A; --blue-bg:#E3EEF5;
  --serif:"Fraunces", Georgia, serif; --sans:"DM Sans", system-ui, -apple-system, sans-serif;
}
[data-theme="dark"]{
  --pine:#9FD0AE; --pine-2:#B6DEC2; --moss:#2C4438; --paper:#141916; --card:#1C231F;
  --ink:#E8EDE8; --muted:#9BAAA1; --line:#2C352F; --on-pine:#10201A;
  --red:#F0A091; --red-bg:#3A211C; --amber:#E8C07A; --amber-bg:#352A16; --blue:#9AC6E0; --blue-bg:#1B2B36;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select,textarea,a.btn{font:inherit}
button{cursor:pointer;color:inherit}
:focus-visible{outline:3px solid #7BA86A;outline-offset:2px}
.hidden{display:none!important}

.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:25px;font-weight:600;color:var(--pine);padding:0 8px;background:none;border:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--pine);color:var(--on-pine);display:grid;place-items:center;font-size:21px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;width:100%}
.nav button:hover{background:var(--paper)}
.nav button.on{background:var(--moss);color:var(--pine);font-weight:600}
.side h4{margin:4px 12px;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.side-add{margin:0 12px;background:none;border:1px dashed var(--line);border-radius:10px;padding:8px;color:var(--muted)}
.side-foot{margin-top:auto}
.main{padding:26px clamp(16px,4vw,46px) 90px;max-width:1120px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.crumb{color:var(--muted);font-size:14px}
.top-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px;padding:0}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--moss);color:var(--pine);font-weight:600;display:grid;place-items:center;overflow:hidden;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:clamp(16px,4vw,46px);top:74px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:250px;box-shadow:0 12px 30px rgba(0,0,0,.14);z-index:30}
.menu p{margin:0 0 10px;font-size:14px;color:var(--muted);word-break:break-all}
.mobile-bar{display:none}

h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5vw,50px);line-height:1.05;margin:0 0 6px;color:var(--pine);letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0;color:var(--pine)}
h3.sec{font-size:14px;font-weight:600;color:var(--muted);margin:26px 0 10px;letter-spacing:.04em}
.sub{color:var(--muted);margin:0}
.btn{background:var(--pine);color:var(--on-pine);border:0;border-radius:12px;padding:11px 18px;font-weight:600;display:inline-block;text-decoration:none;text-align:center}
.btn:hover{background:var(--pine-2)}
.btn.ghost{background:var(--card);color:var(--pine);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid var(--red-bg)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.6}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.row-gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{border:1px dashed var(--line);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;background:var(--card)}
.linkish{background:none;border:0;color:var(--pine);font-weight:600;padding:0;text-align:left}

.today{background:var(--pine);color:var(--on-pine);border-radius:20px;padding:20px 24px;display:grid;grid-template-columns:auto 1fr;gap:2px 22px;align-items:center;margin-bottom:24px}
.today .big{font-family:var(--serif);font-size:60px;line-height:1;grid-row:span 2;opacity:.94}
.today strong{font-size:18px}
.today span{opacity:.82}

.group{margin-bottom:20px}
.group h3{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:var(--on-pine)}
.check.on{background:var(--pine);border-color:var(--pine)}
.t-title{font-weight:500;background:none;border:0;padding:0;text-align:left;width:100%}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;background:var(--moss);color:var(--pine)}
.badge{font-size:13px;font-weight:600;border-radius:8px;padding:4px 10px;white-space:nowrap;background:var(--paper);color:var(--muted)}
.badge.over{background:var(--red-bg);color:var(--red)}
.badge.today{background:var(--amber-bg);color:var(--amber)}
.badge.soon{background:var(--blue-bg);color:var(--blue)}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--red);background:var(--red-bg)}
.empty{padding:26px;text-align:center;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.ccard{text-align:left;border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--card);border-left:8px solid var(--c);display:flex;flex-direction:column;gap:6px;min-height:150px;width:100%}
.ccard:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ccard b{font-size:18px}
.ccard .next{margin-top:auto;font-size:14px;background:var(--paper);border-radius:10px;padding:8px 10px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.kv:first-of-type{border-top:0}
.big-num{font-family:var(--serif);font-size:42px;line-height:1;color:var(--pine)}
.steps{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
.steps li{margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;margin-bottom:12px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--card);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.cal-head{display:flex;align-items:center;gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding-bottom:4px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:92px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%}
.day.dim{opacity:.38}
.day.now{border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.day .n{font-size:12px;color:var(--muted);font-weight:600}
.chip{font-size:11px;background:var(--moss);color:var(--pine);border-radius:6px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.over{background:var(--red-bg);color:var(--red)}
.chip.test{background:var(--amber-bg);color:var(--amber)}

dialog{border:0;border-radius:20px;padding:0;width:min(460px,92vw);color:var(--ink);background:var(--card)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form.sheet{padding:22px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches input{position:absolute;opacity:0;width:1px}
.swatches span{width:32px;height:32px;border-radius:50%;display:block;border:3px solid transparent;cursor:pointer}
.swatches input:checked+span{border-color:var(--ink)}

.landing{min-height:100vh;display:grid;place-items:center;padding:24px}
.land-card{max-width:520px;width:100%}
.land-card h1{font-size:clamp(38px,8vw,60px);margin:20px 0 12px}
.land-card .sub{font-size:18px;margin-bottom:26px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:600}
.err{color:var(--red);font-size:14px;margin-top:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:92vw;text-align:center}

@media (max-width:840px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobile-bar{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px 4px}
  .mobile-bar button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:14px}
  .mobile-bar button.on{background:var(--moss);border-color:var(--moss);color:var(--pine);font-weight:600}
  .task{grid-template-columns:auto 1fr auto;padding:12px}
  .task .x{grid-column:3;grid-row:1}
  .task .badge{grid-column:2;justify-self:start;margin-top:-4px}
  .two{grid-template-columns:1fr}
  .day{min-height:66px}
  .menu{top:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="landing" class="landing hidden">
  <div class="land-card">
    <div class="brand"><span class="brand-mark">s</span>schoolio</div>
    <h1>Every assignment, in one place.</h1>
    <p class="sub">Add your classes, see what's due, and know your grade before the final.</p>
    <button class="gbtn" id="googleBtn">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <p style="text-align:center;margin-top:16px"><button class="linkish" id="demoBtn">Try it without signing in</button></p>
    <p class="err hidden" id="authErr"></p>
  </div>
</section>

<div id="app" class="app hidden">
  <aside class="side">
    <button class="brand" data-go="overview" aria-label="Schoolio home"><span class="brand-mark">s</span>schoolio</button>
    <nav class="nav">
      <button data-go="overview">Today &amp; upcoming</button>
      <button data-go="calendar">Calendar</button>
      <button data-go="classes">All classes</button>
      <button data-go="grades">Grades</button>
    </nav>
    <div>
      <h4>MY CLASSES</h4>
      <nav class="nav" id="sideClasses"></nav>
    </div>
    <button class="side-add" id="sideAddClass">+ Add class</button>
    <div class="side-foot"><nav class="nav"><button data-go="connect">Import schoolwork</button></nav></div>
  </aside>

  <main class="main">
    <div class="top">
      <span class="crumb" id="crumb"></span>
      <div class="top-right">
        <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">◐</button>
        <button class="avatar" id="avatarBtn" aria-label="Account menu" aria-expanded="false"></button>
      </div>
    </div>
    <div class="menu hidden" id="menu">
      <p id="menuEmail"></p>
      <button class="btn ghost" id="signOutBtn" style="width:100%">Sign out</button>
    </div>
    <div class="mobile-bar" id="mobileBar"></div>
    <div id="demoBanner" class="banner hidden">
      <span>You're trying a sample. Changes won't be saved.</span>
      <button class="linkish" id="bannerSignIn">Sign in with Google to save</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<dialog id="taskDlg"><form class="sheet" id="taskForm" method="dialog">
  <h2 id="taskDlgTitle">Add task</h2>
  <label>What do you need to do?<input name="title" required maxlength="140" placeholder="Read chapter 4"></label>
  <label>Class<select name="class_id" id="taskClass"></select></label>
  <div class="two">
    <label>Type<select name="type"><option value="assignment">Assignment</option><option value="test">Test</option><option value="other">Other</option></select></label>
    <label>Due date<input type="date" name="due_date"></label>
  </div>
  <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save</button></div>
</form></dialog>

<dialog id="classDlg"><form class="sheet" id="classForm" method="dialog">
  <h2 id="classDlgTitle">Add class</h2>
  <label>Class name<input name="name" required maxlength="60" placeholder="AP Biology"></label>
  <div class="two">
    <label>Teacher<input name="teacher" maxlength="60" placeholder="Ms. Rivera"></label>
    <label>Teacher email<input name="teacher_email" type="email" maxlength="120" placeholder="rivera@school.org"></label>
  </div>
  <div>
    <div style="font-size:14px;font-weight:500;margin-bottom:8px">Color</div>
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save class</button></div>
</form></dialog>

<dialog id="gradeDlg"><form class="sheet" id="gradeForm" method="dialog">
  <h2>Add a score</h2>
  <label>What was it?<input name="name" required maxlength="80" placeholder="Unit 2 test"></label>
  <div class="two">
    <label>Points earned<input name="score" type="number" step="0.01" required placeholder="88"></label>
    <label>Out of<input name="max_score" type="number" step="0.01" required value="100"></label>
  </div>
  <label>Weight <span style="font-weight:400;color:var(--muted)">(1 is normal, 2 counts double)</span><input name="weight" type="number" step="0.1" min="0.1" value="1"></label>
  <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save score</button></div>
</form></dialog>

<script>
const SUPABASE_URL = "https://phiiyfnlbpsxyrwzcpqo.supabase.co";
const SUPABASE_KEY = "sb_publishable_VKiOF0g8ipAQ3XPzJfml4g_SwlC9QK9";
const SYNC_FN = "Sync-school";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORS = { green:"#6E9A5B", amber:"#C8883A", violet:"#8A7BC0", blue:"#5B8DB0", rose:"#C06A7A", slate:"#6B7C85" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const PLATFORMS = {
  moodle:{ name:"Moodle", steps:["Open your school's Moodle site and go to Calendar","Tap Import or export calendars, then Export calendar","Choose All events and Recent and next 60 days","Tap Get calendar URL, or Export to download a file"] },
  canvas:{ name:"Canvas", steps:["Open Canvas and go to Calendar","Scroll the right sidebar and tap Calendar Feed","Copy the link that appears"] },
  schoology:{ name:"Schoology", steps:["Tap your name, then Settings","Find iCal / Calendar Feed and turn it on","Copy the feed link for your courses"] },
  blackbaud:{ name:"Blackbaud", steps:["Open your Assignment Center or Calendar","Look for Subscribe, Sync, or Export calendar","Copy the iCal link it gives you"] },
  classroom:{ name:"Google Classroom", steps:["Classroom sends work to Google Calendar, so open Google Calendar","Find your class calendar in the left list","Open its Settings and copy the Secret address in iCal format"] },
  powerschool:{ name:"PowerSchool", steps:["Open PowerSchool and find your assignments or calendar","Look for Subscribe to Calendars or an export option","Copy the iCal link, or download the file"] },
  other:{ name:"Another platform", steps:["Look for Calendar, then Subscribe, Export, Sync, or iCal feed","Copy the link, or download the file (it usually ends in .ics)","If there's neither, use Type it in instead"] },
};

let state = { user:null, demo:false, classes:[], tasks:[], grades:[], feed:null, view:"overview", classId:null, calMonth:null, platform:"moodle", syncing:false, method:"file", draft:null };

/* Dates */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const TODAY = () => ymd(new Date());
function dueInfo(due, done){
  if (!due) return { label:"No date", cls:"", bucket:done ? "done" : "later" };
  const t = TODAY();
  const d = new Date(due + "T00:00:00");
  const pretty = d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
  if (done) return { label:pretty, cls:"", bucket:"done" };
  if (due < t) return { label:"Overdue · " + pretty, cls:"over", bucket:"over" };
  if (due === t) return { label:"Today", cls:"today", bucket:"today" };
  if (due === addDays(1)) return { label:"Tomorrow", cls:"soon", bucket:"week" };
  if (due <= addDays(7)) return { label:d.toLocaleDateString(undefined,{weekday:"short"}) + " · " + pretty, cls:"soon", bucket:"week" };
  return { label:pretty, cls:"", bucket:"later" };
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const nClasses = n => `${n} ${n === 1 ? "class" : "classes"}`;

function sampleData(){
  return {
    c:[{ id:"c1", name:"AP Calculus", teacher:"Mr. Hale", teacher_email:"hale@school.org", color:"green" },
       { id:"c2", name:"AP U.S. History", teacher:"Ms. Ortiz", color:"amber" },
       { id:"c3", name:"English Literature", teacher:"Mrs. Chen", color:"violet" },
       { id:"c4", name:"AP Physics", teacher:"Dr. Patel", color:"blue" }],
    t:[{ id:"t1", class_id:"c1", title:"Practice: derivatives", type:"assignment", due_date:TODAY(), done:false, source:"manual" },
       { id:"t2", class_id:"c3", title:"Read & annotate chapter 3", type:"assignment", due_date:TODAY(), done:false, source:"school" },
       { id:"t3", class_id:"c2", title:"Unit 2 test", type:"test", due_date:addDays(2), done:false, source:"school" },
       { id:"t4", class_id:"c4", title:"Motion lab reflection", type:"assignment", due_date:addDays(3), done:false, source:"manual" },
       { id:"t5", class_id:"c1", title:"Limits worksheet", type:"assignment", due_date:addDays(-1), done:false, source:"manual" }],
    g:[{ id:"g1", class_id:"c1", name:"Quiz 1", score:18, max_score:20, weight:1 },
       { id:"g2", class_id:"c1", name:"Unit 1 test", score:82, max_score:100, weight:2 }],
  };
}

/* Data */
async function load(){
  if (state.demo) return;
  const [c,t,g,f] = await Promise.all([
    sb.from("classes").select("*").order("created_at"),
    sb.from("tasks").select("*").order("due_date", { nullsFirst:false }),
    sb.from("grade_items").select("*").order("created_at"),
    sb.from("school_feeds").select("*").order("created_at", { ascending:false }).limit(1),
  ]);
  if (c.error || t.error){ toast("Couldn't load your work. Check your connection and refresh."); return; }
  state.classes = c.data || []; state.tasks = t.data || [];

/* School sync */
async function syncSchool(feedUrl){
  if (state.demo){ toast("Sign in with Google first, then you can connect your school."); return; }
  if (state.syncing) return;
  state.syncing = true; render();
  try {
    const body = feedUrl ? { feed_url:feedUrl, platform:state.platform } : {};
    const { data, error } = await sb.functions.invoke(SYNC_FN, { body });
    if (error){
      let msg = "Sync failed. Double-check the link and try again.";
      try { const j = await error.context?.json(); if (j?.error) msg = j.error; } catch {}
      toast(msg); return;
    }
    if (data?.error){ toast(data.error); return; }
    await load();
    const bits = [`${plural(data.imported || 0, "assignment")} imported`];
    if (data.skipped) bits.push(`${data.skipped} skipped`);
    if (data.unmatched) bits.push(`${data.unmatched} with no class yet`);
    toast(bits.join(" · "));
    state.view = "overview";
  } finally {
    state.syncing = false; render();
  }
}

function classAvg(classId){
  const items = state.grades.filter(g => g.class_id === classId);

  items.forEach(g => { const max = +g.max_score || 0; if (!max) return; const w = +g.weight || 1; pts += (+g.score / max) * w; weight += w; });
  if (!weight) return null;
  return Math.round((pts / weight) * 1000) / 10;
}

  const want = parseFloat($("#want-" + classId).value);

  out.textContent = needed <= 0 ? `You've already got ${want}% locked in, even with a zero on the final.`

/* ---- Import parsing (runs in the browser, saves nothing) ---- */
function unfoldICS(text){
  const out = [];
  for (const raw of text.replace(/\r\n/g,"\n").split("\n")){
    if ((raw.startsWith(" ") || raw.startsWith("\t")) && out.length) out[out.length-1] += raw.slice(1);
    else out.push(raw);
  }
  return out;
}
function parseICSText(text){
  const items = []; let cur = null;
  for (const line of unfoldICS(text)){
    if (line.startsWith("BEGIN:VEVENT")){ cur = {}; continue; }
    if (line.startsWith("END:VEVENT")){ if (cur?.title) items.push(cur); cur = null; continue; }
    if (!cur) continue;
    const i = line.indexOf(":"); if (i < 0) continue;
    const key = line.slice(0,i).split(";")[0].toUpperCase();
    const val = line.slice(i+1).replace(/\\n/gi," ").replace(/\\,/g,",").trim();
    if (key === "UID") cur.uid = val;
    else if (key === "SUMMARY"){ const c = cleanTitle(val); cur.title = c.title; cur.course = c.course; }
    else if ((key === "DTSTART" || key === "DUE") && !cur.due){
      const m = val.match(/^(\d{4})(\d{2})(\d{2})/);
      cur.due = m ? `${m[1]}-${m[2]}-${m[3]}` : null;
    }
    else if ((key === "CATEGORIES" || key === "LOCATION") && !cur.course) cur.course = val.split(",")[0];
  }
  return items;
}
function cleanTitle(raw){
  let t = raw, course = null;
  const b = t.match(/^\[([^\]]+)\]\s*(.+)$/);
  if (b){ course = b[1].trim(); t = b[2]; }
  t = t.replace(/\s+is due$/i,"").replace(/\s+due$/i,"").trim();
  const d = t.match(/^(.+?)\s+[–-]\s+(.+)$/);
  if (!course && d && d[2].length > 3){ course = d[1].trim(); t = d[2].trim(); }
  return { title:(t || raw).slice(0,140), course };
}
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const DAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
function findDate(text){
  const now = new Date(), yr = now.getFullYear();
  let m = text.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return { due:`${m[1]}-${m[2]}-${m[3]}`, rest:text.replace(m[0],"") };
  m = text.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if (m){
    let y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : yr;
    const guess = new Date(y, +m[1]-1, +m[2]);
    if (!m[3] && guess < new Date(now.getFullYear(), now.getMonth(), now.getDate() - 30)) y++;
    return { due:`${y}-${pad(+m[1])}-${pad(+m[2])}`, rest:text.replace(m[0],"") };
  }
  m = text.match(new RegExp(`\\b(${MONTHS.join("|")})[a-z]*\\.?\\s+(\\d{1,2})\\b`,"i"));
  if (m){
    const mo = MONTHS.indexOf(m[1].toLowerCase().slice(0,3));
    let y = yr;
    if (new Date(y, mo, +m[2]) < new Date(now.getFullYear(), now.getMonth(), now.getDate() - 30)) y++;
    return { due:`${y}-${pad(mo+1)}-${pad(+m[2])}`, rest:text.replace(m[0],"") };
  }
  m = text.match(new RegExp(`\\b(today|tomorrow|${DAYS.join("|")})\\b`,"i"));
  if (m){
    const w = m[1].toLowerCase();
    if (w === "today") return { due:TODAY(), rest:text.replace(m[0],"") };
    if (w === "tomorrow") return { due:addDays(1), rest:text.replace(m[0],"") };
    const target = DAYS.indexOf(w), d = new Date();
    let step = (target - d.getDay() + 7) % 7; if (step === 0) step = 7;
    d.setDate(d.getDate() + step);
    return { due:ymd(d), rest:text.replace(m[0],"") };
  }
  return { due:null, rest:text };
}
function parsePastedLines(text){
  return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
    let course = null, body = line;
    const c = line.match(/^([^:]{2,40}):\s*(.+)$/);
    if (c){ course = c[1].trim(); body = c[2].trim(); }
    const { due, rest } = findDate(body);
    let title = rest.replace(/\b(due|on|by)\b/gi," ").replace(/\s{2,}/g," ").replace(/[\s,\-–]+$/,"").trim();
    if (!course){ const cl = cleanTitle(title); title = cl.title; course = cl.course; }
    return { title:title.slice(0,140) || line.slice(0,140), due, course, uid:null };
  }).filter(x => x.title);
}
const normName = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g,"");
function matchClass(course){
  if (!course) return "";
  const k = normName(course);
  for (const c of state.classes){
    const n = normName(c.name);
    if (n === k || (n.length > 3 && (k.includes(n) || n.includes(k)))) return c.id;
  }
  return "";
}
function startReview(items, source){
  if (!items.length){ toast("Couldn't find any assignments in that. Check the file or try typing them in."); return; }
  const seen = new Set(state.tasks.filter(t => t.external_id).map(t => t.external_id));
  const rows = items
    .filter(i => !(i.uid && seen.has(i.uid)))
    .slice(0, 200)
    .map((i, n) => ({ key:"r" + n, title:i.title, due:i.due || "", class_id:matchClass(i.course), course:i.course || "", uid:i.uid || null, keep:true }));
  const dupes = items.length - rows.length;
  state.draft = { rows, source, dupes };
  go("review");
}
function viewReview(){
  const d = state.draft;
  if (!d) return viewConnect();
  const missing = d.rows.filter(r => r.keep && !r.due).length;
  const unfiled = d.rows.filter(r => r.keep && !r.class_id).length;
  return `<div class="head"><div><h1>Review before saving</h1>
      <p class="sub">${d.rows.length} found${d.dupes ? ` · ${d.dupes} already in Schoolio, skipped` : ""}. Nothing is saved until you tap Import.</p></div>
      <button class="btn ghost" data-go="connect">Cancel</button></div>
    ${missing ? `<div class="banner"><span>${plural(missing,"item")} has no date Schoolio could read. Add one or untick it.</span></div>` : ""}
    ${unfiled && state.classes.length ? `<div class="banner"><span>${plural(unfiled,"item")} isn't matched to a class. Pick one, or leave it unfiled.</span></div>` : ""}
    <div class="list">${d.rows.map(r => `<div class="task" style="grid-template-columns:auto 1fr;align-items:start">
      <button class="check ${r.keep ? "on" : ""}" data-keep="${r.key}" aria-label="Include ${esc(r.title)}">${r.keep ? "✓" : ""}</button>
      <div>
        <input value="${esc(r.title)}" data-rtitle="${r.key}" aria-label="Title">
        <div class="two" style="margin-top:8px">
          <input type="date" value="${esc(r.due)}" data-rdue="${r.key}" aria-label="Due date">
          <select data-rclass="${r.key}" aria-label="Class"><option value="">No class${r.course ? ` (was "${esc(r.course)}")` : ""}</option>
            ${state.classes.map(c => `<option value="${c.id}" ${c.id === r.class_id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
        </div>
      </div></div>`).join("")}</div>
    <div class="row-gap" style="margin-top:18px">
      <button class="btn" data-import ${state.syncing ? "disabled" : ""}>${state.syncing ? "Importing…" : `Import ${d.rows.filter(r => r.keep).length} items`}</button>
      <button class="btn ghost" data-go="connect">Back</button></div>`;
}
async function importDraft(){
  const d = state.draft; if (!d) return;
  const keep = d.rows.filter(r => r.keep && r.title.trim());
  if (!keep.length){ toast("Nothing ticked to import."); return; }
  state.syncing = true; render();
  try {
    const rows = keep.map(r => ({
      title:r.title.trim().slice(0,140),
      class_id:r.class_id || null,
      type:/\b(test|exam|quiz|midterm|final)\b/i.test(r.title) ? "test" : "assignment",
      due_date:r.due || null,
      source:d.source,
      external_id:r.uid || null,
    }));
    if (state.demo){
      rows.forEach(r => state.tasks.push({ id:localId("t"), done:false, ...r }));
    } else {
      const { error } = await sb.from("tasks").insert(rows);
      if (error){ toast("Import failed: " + error.message); return; }
      await load();
    }
    state.draft = null;
    toast(`${plural(rows.length,"assignment")} imported`);
    state.view = "overview";
  } finally { state.syncing = false; render(); }
}

function renderNav(){
  const link = c => `<button data-class="${c.id}" class="${state.view === "class" && state.classId === c.id ? "on" : ""}"><span class="dot" style="background:${colorOf(c)}"></span>${esc(c.name)}</button>`;
  $("#sideClasses").innerHTML = state.classes.map(link).join("") || `<p class="sub" style="padding:0 12px;font-size:14px">No classes yet</p>`;
  document.querySelectorAll(".side .nav button[data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === state.view));
  $("#mobileBar").innerHTML =
    `<button data-go="overview" class="${state.view === "overview" ? "on" : ""}">Today</button>
     <button data-go="calendar" class="${state.view === "calendar" ? "on" : ""}">Calendar</button>
     <button data-go="classes" class="${state.view === "classes" ? "on" : ""}">Classes</button>
     <button data-go="grades" class="${state.view === "grades" ? "on" : ""}">Grades</button>
     <button data-go="connect" class="${state.view === "connect" ? "on" : ""}">Import</button>`
    + state.classes.map(link).join("");
}
function render(){
  renderNav();
  const titles = { overview:"Today & upcoming", calendar:"Calendar", classes:"All classes", grades:"Grades", connect:"Import schoolwork", review:"Review import" };
  $("#crumb").textContent = state.view === "class" ? (classById(state.classId)?.name || "") : titles[state.view];
  $("#view").innerHTML = state.view === "overview" ? viewOverview()
    : state.view === "calendar" ? viewCalendar()
    : state.view === "classes" ? viewClasses()
    : state.view === "grades" ? viewGrades()
    : state.view === "connect" ? viewConnect()
    : state.view === "review" ? viewReview()
    : viewClass();
  const plat = $("#plat");
  if (plat) plat.onchange = e => { state.platform = e.target.value; render(); };
  const file = $("#icsFile");
  if (file) file.onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    if (f.size > 5e6){ toast("That file is too big (5 MB max)."); return; }
    try {
      const text = await f.text();
      startReview(text.includes("BEGIN:VCALENDAR") ? parseICSText(text) : parsePastedLines(text), "file");
    } catch { toast("Couldn't read that file."); }
  };
}
function go(view, classId = null){ state.view = view; state.classId = classId; render(); window.scrollTo(0,0); }

/* Events */
let editingTask = null, editingClass = null, gradeClass = null;

document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;
  const d = el.dataset;
  if (d.go) go(d.go);
  else if (d.class) go("class", d.class);
  else if (d.toggle) toggleTask(d.toggle);
  else if (d.del) deleteTask(d.del);
  else if (d.delclass) deleteClass(d.delclass);
  else if (d.edittask) openTask(null, d.edittask);
  else if (d.editclass) openClass(d.editclass);
  else if (d.addgrade) openGrade(d.addgrade);
  else if (d.delgrade) deleteGrade(d.delgrade);
  else if (d.final) runFinal(d.final);
  else if (d.month){
    const b = state.calMonth ? new Date(state.calMonth + "-01T00:00:00") : new Date();
    b.setMonth(b.getMonth() + Number(d.month));
    state.calMonth = `${b.getFullYear()}-${pad(b.getMonth()+1)}`; render();
  }
  else if (d.addtaskDate) openTask(null, null, d.addtaskDate);
  else if ("addclass" in d) openClass();
  else if ("addtask" in d) openTask(d.addtask || null);
  else if ("sync" in d) syncSchool(null);
  else if ("connect" in d){
    const v = $("#feedUrl")?.value.trim();
    if (!v){ toast("Paste your calendar link first."); return; }
    syncSchool(v);
  }
  else if (d.method){ state.method = d.method; render(); }
  else if (d.keep){
    const r = state.draft?.rows.find(x => x.key === d.keep);
    if (r){ r.keep = !r.keep; render(); }
  }
  else if ("parsePaste" in d){
    const v = $("#pasteBox")?.value || "";
    if (!v.trim()){ toast("Type at least one assignment first."); return; }
    startReview(v.includes("BEGIN:VCALENDAR") ? parseICSText(v) : parsePastedLines(v), "typed");
  }
  else if ("import" in d) importDraft();
  else if ("copyBm" in d){
    const ta = $("#bmCode");
    if (ta){ ta.select(); try { document.execCommand("copy"); toast("Copied. Now paste it as a bookmark's address."); }
      catch { toast("Press and hold the code to copy it."); } }
  }
  else if ("close" in d) el.closest("dialog").close();
});
/* Keep review edits in memory as they're typed */
document.addEventListener("input", e => {
  const el = e.target, d = el.dataset, rows = state.draft?.rows;
  if (!rows) return;
  const key = d.rtitle || d.rdue || d.rclass; if (!key) return;
  const r = rows.find(x => x.key === key); if (!r) return;
  if (d.rtitle) r.title = el.value;
  else if (d.rdue) r.due = el.value;
  else if (d.rclass) r.class_id = el.value;
});
$("#sideAddClass").onclick = () => openClass();

function openTask(classId, taskId = null, date = null){
  if (!state.classes.length){ openClass(); return; }
  editingTask = taskId;
  const t = taskId ? state.tasks.find(x => x.id === taskId) : null;
  $("#taskDlgTitle").textContent = t ? "Edit task" : "Add task";
  $("#taskClass").innerHTML = state.classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  const f = $("#taskForm"); f.reset();
  f.title.value = t?.title || "";
  f.class_id.value = t?.class_id || classId || state.classes[0].id;
  f.type.value = t?.type || "assignment";
  f.due_date.value = t?.due_date || date || TODAY();
  $("#taskDlg").showModal();
}
function openClass(classId = null){
  editingClass = classId;
  const c = classId ? classById(classId) : null;
  $("#classDlgTitle").textContent = c ? "Edit class" : "Add class";
  const active = c?.color || "green";
  $("#swatches").innerHTML = Object.entries(COLORS).map(([k,v]) =>
    `<label><input type="radio" name="color" value="${k}" ${k === active ? "checked" : ""} aria-label="${k}"><span style="background:${v}"></span></label>`).join("");
  const f = $("#classForm");
  f.name.value = c?.name || ""; f.teacher.value = c?.teacher || ""; f.teacher_email.value = c?.teacher_email || "";
  $("#classDlg").showModal();
}
function openGrade(classId){
  gradeClass = classId;
  const f = $("#gradeForm"); f.reset(); f.max_score.value = 100; f.weight.value = 1;
  $("#gradeDlg").showModal();
}

$("#taskForm").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  const row = { title:f.title.value.trim(), class_id:f.class_id.value, type:f.type.value, due_date:f.due_date.value || null };
  const ok = editingTask ? await updateTask(editingTask, row) : await addTask(row);
  if (ok){ $("#taskDlg").close(); render(); toast(editingTask ? "Task updated" : "Task saved"); }
});
$("#classForm").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  const row = { name:f.name.value.trim(), teacher:f.teacher.value.trim() || null, teacher_email:f.teacher_email.value.trim() || null, color:f.color.value };
  const ok = editingClass ? await updateClass(editingClass, row) : await addClass(row);
  if (ok){ $("#classDlg").close(); render(); toast(editingClass ? "Class updated" : "Class saved"); }
});
$("#gradeForm").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  const max = parseFloat(f.max_score.value);
  if (!max || max <= 0){ toast('"Out of" needs to be more than zero.'); return; }
  const ok = await addGrade({ class_id:gradeClass, name:f.name.value.trim(), score:parseFloat(f.score.value), max_score:max, weight:parseFloat(f.weight.value) || 1 });
  if (ok){ $("#gradeDlg").close(); render(); toast("Score saved"); }
});

/* Theme */
function setTheme(t){ document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("schoolio-theme", t); } catch {} }
$("#themeBtn").onclick = () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
try {
  const saved = localStorage.getItem("schoolio-theme");
  if (saved) setTheme(saved);
  else if (window.matchMedia("(prefers-color-scheme: dark)").matches) setTheme("dark");
} catch {}

/* Account */
$("#avatarBtn").onclick = e => {
  e.stopPropagation();
  const m = $("#menu"); m.classList.toggle("hidden");
  $("#avatarBtn").setAttribute("aria-expanded", String(!m.classList.contains("hidden")));
};
document.addEventListener("click", e => { if (!e.target.closest("#menu") && !e.target.closest("#avatarBtn")) $("#menu").classList.add("hidden"); });
$("#signOutBtn").onclick = async () => { if (state.demo){ location.reload(); return; } await sb.auth.signOut(); location.reload(); };

async function signIn(){
  const { error } = await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: location.origin + location.pathname } });
  if (error){ const p = $("#authErr"); p.textContent = "Google sign-in didn't start: " + error.message; p.classList.remove("hidden"); }
}
$("#googleBtn").onclick = signIn;
$("#bannerSignIn").onclick = signIn;
$("#demoBtn").onclick = () => { const d = sampleData(); state = { ...state, demo:true, classes:d.c, tasks:d.t, grades:d.g }; showApp(); };

function showApp(){
  $("#landing").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#demoBanner").classList.toggle("hidden", !state.demo);
  const u = state.user, pic = u?.user_metadata?.avatar_url, nm = u?.user_metadata?.full_name || u?.email || "Guest";
  $("#avatarBtn").innerHTML = pic ? `<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer">` : esc(nm[0].toUpperCase());
  $("#menuEmail").textContent = state.demo ? "Sample mode" : (u?.email || "");
  $("#signOutBtn").textContent = state.demo ? "Leave sample" : "Sign out";
  render();
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
}

function pendingGrab(){
  const m = location.search.match(/[?&]grab=([^&]+)/);
  if (!m) return null;
  history.replaceState({}, "", location.pathname);
  try { return decodeURIComponent(m[1]); } catch { return null; }
}
(async function start(){
  const grabbed = pendingGrab();
  const { data:{ session } } = await sb.auth.getSession();
  if (session){
    state.user = session.user; await load(); showApp();
    if (grabbed) startReview(parsePastedLines(grabbed), "grab");
  }
  else $("#landing").classList.remove("hidden");
  sb.auth.onAuthStateChange(async (event, s) => {
    if (event === "SIGNED_IN" && !state.user){ state.user = s.user; state.demo = false; await load(); showApp(); }
  });
})();
</script>
