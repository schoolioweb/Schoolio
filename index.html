<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schoolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --pine:#23473A; --pine-2:#2F5E4D; --moss:#DCE9C6; --paper:#F6F7F2; --card:#FFFFFF;
  --ink:#1D2A24; --muted:#66756D; --line:#E3E7DF;
  --red:#B3412F; --red-bg:#FBE6E1; --amber:#8A5A12; --amber-bg:#F8ECD3; --blue:#2C5A7A; --blue-bg:#E3EEF5;
  --serif:"Fraunces", Georgia, serif; --sans:"DM Sans", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7BA86A;outline-offset:2px}
.hidden{display:none!important}

/* Layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--pine);padding:0 8px;background:none;border:0}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--pine);color:var(--moss);display:grid;place-items:center;font-size:22px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--ink)}
.nav button:hover{background:var(--paper)}
.nav button.on{background:var(--moss);color:var(--pine);font-weight:600}
.side h4{margin:4px 12px;font-size:13px;color:var(--muted);font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.side-add{margin:0 12px;background:none;border:1px dashed var(--line);border-radius:10px;padding:8px;color:var(--muted)}
.main{padding:28px clamp(16px,4vw,48px) 80px;max-width:1100px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.crumb{color:var(--muted);font-size:14px}
.avatar{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--moss);color:var(--pine);font-weight:600;display:grid;place-items:center;overflow:hidden;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:clamp(16px,4vw,48px);top:74px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:240px;box-shadow:0 12px 30px rgba(35,71,58,.12);z-index:30}
.menu p{margin:0 0 10px;font-size:14px;color:var(--muted);word-break:break-all}
.mobile-bar{display:none}

h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,52px);line-height:1.05;margin:0 0 6px;color:var(--pine);letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0;color:var(--pine)}
.sub{color:var(--muted);margin:0}
.btn{background:var(--pine);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:600}
.btn:hover{background:var(--pine-2)}
.btn.ghost{background:var(--card);color:var(--pine);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid var(--red-bg)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}

.banner{border:1px dashed #C9D3C1;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;background:#FBFCF8}
.linkish{background:none;border:0;color:var(--pine);font-weight:600;padding:0}

/* Today strip */
.today{background:var(--pine);color:#fff;border-radius:20px;padding:22px 24px;display:grid;grid-template-columns:auto 1fr;gap:4px 24px;align-items:center;margin-bottom:28px}
.today .big{font-family:var(--serif);font-size:64px;line-height:1;color:var(--moss);grid-row:span 2}
.today strong{font-size:18px}
.today span{color:#C6D8C9}

/* Task list */
.group{margin-bottom:22px}
.group h3{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{width:24px;height:24px;border-radius:7px;border:2px solid #B9C4B6;background:#fff;display:grid;place-items:center;padding:0;color:#fff}
.check.on{background:var(--pine);border-color:var(--pine)}
.t-title{font-weight:500}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:13px;font-weight:600;border-radius:8px;padding:4px 10px;white-space:nowrap;background:var(--paper);color:var(--muted)}
.badge.over{background:var(--red-bg);color:var(--red)}
.badge.today{background:var(--amber-bg);color:var(--amber)}
.badge.soon{background:var(--blue-bg);color:var(--blue)}
.x{background:none;border:0;color:#A3ADA6;font-size:20px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--red);background:var(--red-bg)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Class cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ccard{text-align:left;border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--card);border-left:8px solid var(--c);display:flex;flex-direction:column;gap:6px;min-height:150px}
.ccard:hover{box-shadow:0 6px 18px rgba(35,71,58,.08)}
.ccard b{font-size:18px}
.ccard .next{margin-top:auto;font-size:14px;color:var(--ink);background:var(--paper);border-radius:10px;padding:8px 10px}

/* Modal */
dialog{border:0;border-radius:20px;padding:0;width:min(440px,92vw);color:var(--ink)}
dialog::backdrop{background:rgba(29,42,36,.4)}
form.sheet{padding:24px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
input,select{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;width:100%}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches input{position:absolute;opacity:0;width:1px}
.swatches span{width:32px;height:32px;border-radius:50%;display:block;border:3px solid transparent;cursor:pointer}
.swatches input:checked+span{border-color:var(--ink)}
.swatches input:focus-visible+span{outline:3px solid #7BA86A}

/* Signed-out landing */
.landing{min-height:100vh;display:grid;place-items:center;padding:24px}
.land-card{max-width:520px;width:100%}
.land-card h1{font-size:clamp(40px,8vw,64px);margin:22px 0 12px}
.land-card .sub{font-size:18px;margin-bottom:28px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;border:1px solid #CBD2C7;border-radius:14px;padding:14px;font-weight:600}
.gbtn:hover{background:#FAFBF8}
.err{color:var(--red);font-size:14px;margin-top:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:14px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobile-bar{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 18px;padding:0 16px 4px}
  .mobile-bar button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:14px}
  .mobile-bar button.on{background:var(--moss);border-color:var(--moss);color:var(--pine);font-weight:600}
  .task{grid-template-columns:auto 1fr auto;padding:12px}
  .task .x{grid-column:3;grid-row:1}
  .task .badge{grid-column:2;justify-self:start;margin-top:-4px}
  .menu{top:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- Signed out -->
<section id="landing" class="landing hidden">
  <div class="land-card">
    <div class="brand"><span class="brand-mark">s</span>schoolio</div>
    <h1>Every assignment, in one place.</h1>
    <p class="sub">Add your classes, track what's due, and see what needs you today.</p>
    <button class="gbtn" id="googleBtn">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <p style="text-align:center;margin-top:16px"><button class="linkish" id="demoBtn">Try it without signing in</button></p>
    <p class="err hidden" id="authErr"></p>
  </div>
</section>

<!-- App -->
<div id="app" class="app hidden">
  <aside class="side">
    <button class="brand" data-go="overview" aria-label="Schoolio home"><span class="brand-mark">s</span>schoolio</button>
    <nav class="nav">
      <button data-go="overview">Today &amp; upcoming</button>
      <button data-go="classes">All classes</button>
    </nav>
    <div>
      <h4>My classes</h4>
      <nav class="nav" id="sideClasses"></nav>
    </div>
    <button class="side-add" id="sideAddClass">+ Add class</button>
  </aside>

  <main class="main">
    <div class="top">
      <span class="crumb" id="crumb"></span>
      <button class="avatar" id="avatarBtn" aria-label="Account menu" aria-expanded="false"></button>
    </div>
    <div class="menu hidden" id="menu">
      <p id="menuEmail"></p>
      <button class="btn ghost" id="signOutBtn" style="width:100%">Sign out</button>
    </div>
    <div class="mobile-bar" id="mobileBar"></div>
    <div id="demoBanner" class="banner hidden">
      <span>You're trying a sample. Changes won't be saved.</span>
      <button class="linkish" id="bannerSignIn">Sign in with Google to save</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<!-- Add task -->
<dialog id="taskDlg">
  <form class="sheet" id="taskForm" method="dialog">
    <h2>Add task</h2>
    <label>What do you need to do?<input name="title" required maxlength="140" placeholder="Read chapter 4"></label>
    <label>Class<select name="class_id" id="taskClass"></select></label>
    <label>Type
      <select name="type"><option value="assignment">Assignment</option><option value="test">Test</option><option value="other">Other</option></select>
    </label>
    <label>Due date<input type="date" name="due_date"></label>
    <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save task</button></div>
  </form>
</dialog>

<!-- Add class -->
<dialog id="classDlg">
  <form class="sheet" id="classForm" method="dialog">
    <h2>Add class</h2>
    <label>Class name<input name="name" required maxlength="60" placeholder="AP Biology"></label>
    <label>Teacher<input name="teacher" maxlength="60" placeholder="Ms. Rivera"></label>
    <div>
      <div style="font-size:14px;font-weight:500;margin-bottom:8px">Color</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save class</button></div>
  </form>
</dialog>

<script>
const SUPABASE_URL = "https://phiiyfnlbpsxyrwzcpqo.supabase.co";
const SUPABASE_KEY = "sb_publishable_VKiOF0g8ipAQ3XPzJfml4g_SwlC9QK9";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORS = { green:"#6E9A5B", amber:"#C8883A", violet:"#8A7BC0", blue:"#5B8DB0", rose:"#C06A7A", slate:"#6B7C85" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let state = { user:null, demo:false, classes:[], tasks:[], view:"overview", classId:null };

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const TODAY = () => ymd(new Date());
function dueInfo(due, done){
  if (!due) return { label:"No date", cls:"", bucket:"later" };
  const t = TODAY(), wk = addDays(7);
  const d = new Date(due + "T00:00:00");
  const pretty = d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
  if (done) return { label:pretty, cls:"", bucket:"done" };
  if (due < t) return { label:"Overdue · " + pretty, cls:"over", bucket:"over" };
  if (due === t) return { label:"Today", cls:"today", bucket:"today" };
  if (due === addDays(1)) return { label:"Tomorrow", cls:"soon", bucket:"week" };
  if (due <= wk) return { label:d.toLocaleDateString(undefined,{weekday:"short"}) + " · " + pretty, cls:"soon", bucket:"week" };
  return { label:pretty, cls:"", bucket:"later" };
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

/* ---------- Sample data ---------- */
function sampleData(){
  const c = [
    { id:"c1", name:"AP Calculus", teacher:"Mr. Hale", color:"green" },
    { id:"c2", name:"AP U.S. History", teacher:"Ms. Ortiz", color:"amber" },
    { id:"c3", name:"English Literature", teacher:"Mrs. Chen", color:"violet" },
    { id:"c4", name:"AP Physics", teacher:"Dr. Patel", color:"blue" },
  ];
  const t = [
    { id:"t1", class_id:"c1", title:"Practice: derivatives", type:"assignment", due_date:TODAY(), done:false },
    { id:"t2", class_id:"c3", title:"Read & annotate chapter 3", type:"assignment", due_date:TODAY(), done:false },
    { id:"t3", class_id:"c2", title:"Unit 2 test", type:"test", due_date:addDays(2), done:false },
    { id:"t4", class_id:"c4", title:"Motion lab reflection", type:"assignment", due_date:addDays(3), done:false },
    { id:"t5", class_id:"c1", title:"Limits worksheet", type:"assignment", due_date:addDays(-1), done:false },
  ];
  return { c, t };
}

/* ---------- Data ---------- */
async function load(){
  if (state.demo) return;
  const [c, t] = await Promise.all([
    sb.from("classes").select("*").order("created_at"),
    sb.from("tasks").select("*").order("due_date", { nullsFirst:false }),
  ]);
  if (c.error || t.error) { toast("Couldn't load your work. Check your connection and refresh."); return; }
  state.classes = c.data; state.tasks = t.data;
}

async function addClass(row){
  if (state.demo){ state.classes.push({ id:"c"+Date.now(), ...row }); return true; }
  const { data, error } = await sb.from("classes").insert(row).select().single();
  if (error){ toast("Class wasn't saved: " + error.message); return false; }
  state.classes.push(data); return true;
}
async function addTask(row){
  if (state.demo){ state.tasks.push({ id:"t"+Date.now(), done:false, ...row }); return true; }
  const { data, error } = await sb.from("tasks").insert(row).select().single();
  if (error){ toast("Task wasn't saved: " + error.message); return false; }
  state.tasks.push(data); return true;
}
async function toggleTask(id){
  const task = state.tasks.find(x => x.id === id); if (!task) return;
  task.done = !task.done; render();
  if (!state.demo){
    const { error } = await sb.from("tasks").update({ done:task.done }).eq("id", id);
    if (error){ task.done = !task.done; render(); toast("Couldn't update that task."); }
  }
}
async function deleteTask(id){
  const before = state.tasks; state.tasks = state.tasks.filter(x => x.id !== id); render();
  if (!state.demo){
    const { error } = await sb.from("tasks").delete().eq("id", id);
    if (error){ state.tasks = before; render(); toast("Couldn't delete that task."); }
  }
}
async function deleteClass(id){
  const cls = state.classes.find(c => c.id === id);
  if (!confirm(`Delete ${cls.name} and all its tasks?`)) return;
  if (!state.demo){
    const { error } = await sb.from("classes").delete().eq("id", id);
    if (error){ toast("Couldn't delete that class."); return; }
  }
  state.classes = state.classes.filter(c => c.id !== id);
  state.tasks = state.tasks.filter(t => t.class_id !== id);
  go("classes");
}

/* ---------- Rendering ---------- */
const classById = id => state.classes.find(c => c.id === id);
const colorOf = cls => COLORS[cls?.color] || COLORS.slate;

function taskRow(t){
  const cls = classById(t.class_id), info = dueInfo(t.due_date, t.done);
  return `<div class="task ${t.done ? "done" : ""}">
    <button class="check ${t.done ? "on" : ""}" data-toggle="${t.id}" aria-label="${t.done ? "Mark not done" : "Mark done"}: ${esc(t.title)}">${t.done ? "✓" : ""}</button>
    <div><div class="t-title">${esc(t.title)}</div>
      <div class="t-meta">${cls ? `<span class="dot" style="background:${colorOf(cls)}"></span>${esc(cls.name)}` : "No class"} <span>·</span> ${t.type === "test" ? "Test" : t.type === "other" ? "Other" : "Assignment"}</div></div>
    <span class="badge ${info.cls}">${info.label}</span>
    <button class="x" data-del="${t.id}" aria-label="Delete ${esc(t.title)}">×</button>
  </div>`;
}

function groupedList(tasks, emptyMsg){
  if (!tasks.length) return `<div class="list"><div class="empty">${emptyMsg}</div></div>`;
  const groups = { over:[], today:[], week:[], later:[], done:[] };
  tasks.forEach(t => groups[dueInfo(t.due_date, t.done).bucket].push(t));
  const names = { over:"Overdue", today:"Due today", week:"This week", later:"Later", done:"Done" };
  return Object.keys(groups).filter(k => groups[k].length).map(k =>
    `<div class="group"><h3>${names[k]} (${groups[k].length})</h3><div class="list">${groups[k].map(taskRow).join("")}</div></div>`
  ).join("");
}

function viewOverview(){
  const open = state.tasks.filter(t => !t.done);
  const dueToday = open.filter(t => { const b = dueInfo(t.due_date).bucket; return b === "today" || b === "over"; });
  const nextTest = open.filter(t => t.type === "test" && t.due_date && t.due_date >= TODAY()).sort((a,b) => a.due_date.localeCompare(b.due_date))[0];
  const name = state.user?.user_metadata?.full_name?.split(" ")[0];
  const hello = new Date().getHours() < 12 ? "Good morning" : new Date().getHours() < 18 ? "Good afternoon" : "Good evening";

  if (!state.classes.length){
    return `<div class="head"><div><h1>${hello}${name ? ", " + esc(name) : ""}.</h1><p class="sub">Start by adding the classes you're taking.</p></div></div>
      <div class="list"><div class="empty"><p>No classes yet.</p><button class="btn" data-addclass>Add your first class</button></div></div>`;
  }
  return `<div class="head">
      <div><h1>${hello}${name ? ", " + esc(name) : ""}.</h1><p class="sub">${plural(open.length, "open task")} across ${plural(state.classes.length, "class").replace("classs","classes")}.</p></div>
      <button class="btn" data-addtask>+ Add task</button>
    </div>
    <div class="today">
      <div class="big">${dueToday.length}</div>
      <strong>${dueToday.length ? `${dueToday.length === 1 ? "thing needs" : "things need"} you today` : "Nothing due today"}</strong>
      <span>${nextTest ? `Next test: ${esc(nextTest.title)}, ${dueInfo(nextTest.due_date).label}` : "No tests coming up"}</span>
    </div>
    ${groupedList(state.tasks, "No tasks yet. Add one to get started.")}`;
}

function viewClasses(){
  return `<div class="head"><div><h1>Classes</h1><p class="sub">${plural(state.classes.length, "class").replace("classs","classes")}</p></div><button class="btn" data-addclass>+ Add class</button></div>
  ${state.classes.length ? `<div class="grid">${state.classes.map(c => {
    const open = state.tasks.filter(t => t.class_id === c.id && !t.done).sort((a,b) => (a.due_date || "9999").localeCompare(b.due_date || "9999"));
    const next = open[0];
    return `<button class="ccard" style="--c:${colorOf(c)}" data-class="${c.id}">
      <b>${esc(c.name)}</b><span class="sub">${c.teacher ? esc(c.teacher) : "No teacher added"}</span>
      <span class="next">${next ? `Next: ${esc(next.title)}, ${dueInfo(next.due_date).label}` : "Nothing due"}</span>
    </button>`; }).join("")}</div>` : `<div class="list"><div class="empty">No classes yet.</div></div>`}`;
}

function viewClass(){
  const c = classById(state.classId); if (!c) return viewClasses();
  const tasks = state.tasks.filter(t => t.class_id === c.id);
  return `<div class="head">
      <div><h1 style="display:flex;align-items:center;gap:14px"><span class="dot" style="width:18px;height:18px;background:${colorOf(c)}"></span>${esc(c.name)}</h1>
      <p class="sub">${c.teacher ? esc(c.teacher) : "No teacher added"}</p></div>
      <div style="display:flex;gap:8px"><button class="btn danger" data-delclass="${c.id}">Delete class</button><button class="btn" data-addtask="${c.id}">+ Add task</button></div>
    </div>
    ${groupedList(tasks, "Nothing for this class yet.")}`;
}

function renderNav(){
  const side = state.classes.map(c => `<button data-class="${c.id}" class="${state.view === "class" && state.classId === c.id ? "on" : ""}"><span class="dot" style="background:${colorOf(c)}"></span>${esc(c.name)}</button>`).join("");
  $("#sideClasses").innerHTML = side || `<p class="sub" style="padding:0 12px;font-size:14px">No classes yet</p>`;
  document.querySelectorAll(".side .nav button[data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === state.view));
  $("#mobileBar").innerHTML =
    `<button data-go="overview" class="${state.view === "overview" ? "on" : ""}">Today</button>` +
    `<button data-go="classes" class="${state.view === "classes" ? "on" : ""}">Classes</button>` +
    state.classes.map(c => `<button data-class="${c.id}" class="${state.view === "class" && state.classId === c.id ? "on" : ""}"><span class="dot" style="background:${colorOf(c)}"></span>${esc(c.name)}</button>`).join("") +
    `<button data-addclass>+ Class</button>`;
}

function render(){
  renderNav();
  $("#crumb").textContent = state.view === "overview" ? "Today & upcoming" : state.view === "classes" ? "All classes" : (classById(state.classId)?.name || "");
  $("#view").innerHTML = state.view === "overview" ? viewOverview() : state.view === "classes" ? viewClasses() : viewClass();
}
function go(view, classId = null){ state.view = view; state.classId = classId; render(); window.scrollTo(0,0); }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;
  if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.class) go("class", el.dataset.class);
  else if (el.dataset.toggle) toggleTask(el.dataset.toggle);
  else if (el.dataset.del) deleteTask(el.dataset.del);
  else if (el.dataset.delclass) deleteClass(el.dataset.delclass);
  else if ("addclass" in el.dataset) openClass();
  else if ("addtask" in el.dataset) openTask(el.dataset.addtask);
  else if ("close" in el.dataset) el.closest("dialog").close();
});
$("#sideAddClass").onclick = openClass;

function openTask(classId){
  if (!state.classes.length){ openClass(); return; }
  $("#taskClass").innerHTML = state.classes.map(c => `<option value="${c.id}" ${c.id === classId ? "selected" : ""}>${esc(c.name)}</option>`).join("");
  $("#taskForm").reset();
  if (classId) $("#taskClass").value = classId;
  $("#taskForm").due_date.value = TODAY();
  $("#taskDlg").showModal();
}
function openClass(){
  $("#classForm").reset();
  $("#swatches").innerHTML = Object.entries(COLORS).map(([k,v],i) => `<label><input type="radio" name="color" value="${k}" ${i === 0 ? "checked" : ""} aria-label="${k}"><span style="background:${v}"></span></label>`).join("");
  $("#classDlg").showModal();
}
$("#taskForm").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  const ok = await addTask({ title:f.title.value.trim(), class_id:f.class_id.value, type:f.type.value, due_date:f.due_date.value || null });
  if (ok){ $("#taskDlg").close(); render(); toast("Task saved"); }
});
$("#classForm").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  const ok = await addClass({ name:f.name.value.trim(), teacher:f.teacher.value.trim() || null, color:f.color.value });
  if (ok){ $("#classDlg").close(); render(); toast("Class saved"); }
});

/* Account menu */
$("#avatarBtn").onclick = e => { e.stopPropagation(); const m = $("#menu"); m.classList.toggle("hidden"); $("#avatarBtn").setAttribute("aria-expanded", !m.classList.contains("hidden")); };
document.addEventListener("click", e => { if (!e.target.closest("#menu") && !e.target.closest("#avatarBtn")) $("#menu").classList.add("hidden"); });
$("#signOutBtn").onclick = async () => { if (state.demo){ location.reload(); return; } await sb.auth.signOut(); location.reload(); };

/* Auth */
async function signIn(){
  const { error } = await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: location.origin + location.pathname } });
  if (error){ const p = $("#authErr"); p.textContent = "Google sign-in didn't start: " + error.message; p.classList.remove("hidden"); }
}
$("#googleBtn").onclick = signIn;
$("#bannerSignIn").onclick = signIn;
$("#demoBtn").onclick = () => { const d = sampleData(); state = { ...state, demo:true, classes:d.c, tasks:d.t }; showApp(); };

function showApp(){
  $("#landing").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#demoBanner").classList.toggle("hidden", !state.demo);
  const u = state.user, pic = u?.user_metadata?.avatar_url, nm = u?.user_metadata?.full_name || u?.email || "Guest";
  $("#avatarBtn").innerHTML = pic ? `<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer">` : esc(nm[0].toUpperCase());
  $("#menuEmail").textContent = state.demo ? "Sample mode" : (u?.email || "");
  $("#signOutBtn").textContent = state.demo ? "Leave sample" : "Sign out";
  render();
}
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }

(async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session){ state.user = session.user; await load(); showApp(); }
  else $("#landing").classList.remove("hidden");
  sb.auth.onAuthStateChange(async (event, s) => {
    if (event === "SIGNED_IN" && !state.user){ state.user = s.user; state.demo = false; await load(); showApp(); }
  });
})();
</script>
</body>
</html>
