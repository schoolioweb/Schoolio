<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schoolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/styles.css">
<script type="module" src="src/app.js"></script>
</head>
<body>

<section id="landing" class="landing hidden">
  <div class="land-card">
    <div class="brand"><span class="brand-mark">s</span>schoolio</div>
    <h1>Every assignment, in one place.</h1>
    <p class="sub">Add your classes, see what's due, and know your grade before the final.</p>
    <button class="gbtn" id="googleBtn">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <p style="text-align:center;margin-top:16px"><button class="linkish" id="demoBtn">Try it without signing in</button></p>
    <p class="err hidden" id="authErr"></p>
  </div>
</section>

<div id="app" class="app hidden">
  <aside class="side">
    <button class="brand" data-go="overview" aria-label="Schoolio home"><span class="brand-mark">s</span>schoolio</button>
    <nav class="nav">
      <button data-go="overview">Today &amp; upcoming</button>
      <button data-go="calendar">Calendar</button>
      <button data-go="classes">All classes</button>
      <button data-go="grades">Grades</button>
    </nav>
    <div>
      <h4>MY CLASSES</h4>
      <nav class="nav" id="sideClasses"></nav>
    </div>
    <button class="side-add" id="sideAddClass">+ Add class</button>
    <div class="side-foot"><nav class="nav"><button data-go="connect">Import schoolwork</button></nav></div>
  </aside>

  <main class="main">
    <div class="top">
      <span class="crumb" id="crumb"></span>
      <div class="top-right">
        <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">◐</button>
        <button class="avatar" id="avatarBtn" aria-label="Account menu" aria-expanded="false"></button>
      </div>
    </div>
    <div class="menu hidden" id="menu">
      <p id="menuEmail"></p>
      <button class="btn ghost" id="signOutBtn" style="width:100%">Sign out</button>
    </div>
    <div class="mobile-bar" id="mobileBar"></div>
    <div id="demoBanner" class="banner hidden">
      <span>You're trying a sample. Changes won't be saved.</span>
      <button class="linkish" id="bannerSignIn">Sign in with Google to save</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<dialog id="taskDlg"><form class="sheet" id="taskForm" method="dialog">
  <h2 id="taskDlgTitle">Add task</h2>
  <label>What do you need to do?<input name="title" required maxlength="140" placeholder="Read chapter 4"></label>
  <label>Class<select name="class_id" id="taskClass"></select></label>
  <div class="two">
    <label>Type<select name="type"><option value="assignment">Assignment</option><option value="test">Test</option><option value="other">Other</option></select></label>
    <label>Due date<input type="date" name="due_date"></label>
  </div>
  <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save</button></div>
</form></dialog>

<dialog id="classDlg"><form class="sheet" id="classForm" method="dialog">
  <h2 id="classDlgTitle">Add class</h2>
  <label>Class name<input name="name" required maxlength="60" placeholder="AP Biology"></label>
  <div class="two">
    <label>Teacher<input name="teacher" maxlength="60" placeholder="Ms. Rivera"></label>
    <label>Teacher email<input name="teacher_email" type="email" maxlength="120" placeholder="rivera@school.org"></label>
  </div>
  <div>
    <div style="font-size:14px;font-weight:500;margin-bottom:8px">Color</div>
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save class</button></div>
</form></dialog>

<dialog id="gradeDlg"><form class="sheet" id="gradeForm" method="dialog">
  <h2>Add a score</h2>
  <label>What was it?<input name="name" required maxlength="80" placeholder="Unit 2 test"></label>
  <div class="two">
    <label>Points earned<input name="score" type="number" step="0.01" required placeholder="88"></label>
    <label>Out of<input name="max_score" type="number" step="0.01" required value="100"></label>
  </div>
  <label>Weight <span style="font-weight:400;color:var(--muted)">(1 is normal, 2 counts double)</span><input name="weight" type="number" step="0.1" min="0.1" value="1"></label>
  <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save score</button></div>
</form></dialog>

</body>
</html>
